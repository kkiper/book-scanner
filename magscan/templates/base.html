<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}magscan{% endblock %}</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e3e6ec; --accent:#2f6fde; --ok:#16803c; --warn:#b54708; --err:#c0262d; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1d2128; --text:#e6e8ec; --muted:#98a1b0; --line:#2c323c; --accent:#6b9cf2; --ok:#4cc27a; --warn:#f0a35c; --err:#f0696f; } }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
header { display:flex; gap:16px; align-items:center; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
header a { color:var(--text); text-decoration:none; font-weight:600; }
header .brand { font-size:17px; margin-right:auto; }
main { padding:20px; max-width:1300px; margin:0 auto; }
a { color:var(--accent); }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
button, .btn { font:inherit; padding:6px 12px; border-radius:7px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; text-decoration:none; display:inline-block; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.danger { color:var(--err); }
input[type=text], input[type=number], textarea, select { font:inherit; width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
textarea { min-height:70px; }
label { display:block; font-weight:600; margin:10px 0 4px; }
.muted { color:var(--muted); }
.tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.tabs a { padding:5px 10px; border-radius:20px; border:1px solid var(--line); text-decoration:none; color:var(--text); background:var(--card); }
.tabs a.on { background:var(--accent); color:#fff; border-color:var(--accent); }
table { width:100%; border-collapse:collapse; }
td, th { padding:8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
img.thumb { width:60px; border-radius:4px; border:1px solid var(--line); }
.arrow { color:var(--muted); }
.badge { font-size:12px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); white-space:nowrap; }
.err { color:var(--err); } .ok { color:var(--ok); } .warn { color:var(--warn); }
.grid { display:grid; grid-template-columns: minmax(220px, 380px) 1fr; gap:20px; }
.grid img { width:100%; border-radius:8px; border:1px solid var(--line); }
.row { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:0 12px; }
code { background:var(--bg); padding:1px 5px; border-radius:4px; }
pre { white-space:pre-wrap; margin:0; font:inherit; }
@media (max-width: 760px) { .grid { grid-template-columns:1fr; } td.hide-sm, th.hide-sm { display:none; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">magscan</a>
  <a href="/">Library</a>
  <a href="/settings">Settings</a>
</header>
<main>{% block main %}{% endblock %}</main>
<footer class="muted" style="text-align:center;padding:16px">magscan {{ version }}</footer>
</body>
</html>
